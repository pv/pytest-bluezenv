name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Update packages
      run: >-
        sudo apt-get update
    - name: Install packages
      run: >-
        sudo apt-get install -y --no-install-recommends
        black
        bluez
        chrony
        curl
        dbus
        libglib2.0-dev
        python3-dbus
        python3-gi
        python3-pexpect
        python3-pytest-xdist
        qemu-system-x86
        zstd
    - name: Download kernel
      run: >-
        curl -sSfL -o "${RUNNER_TEMP}/bzImage"
        https://github.com/pv/bluez-test-functional-kernel/releases/download/2026-09-15.1/bzImage-v7.2-cfgc2208dd3
    - name: Download User Mode Linux kernel
      run: >-
        curl -sSfL -o "${RUNNER_TEMP}/linux.zst"
        https://github.com/pv/bluez-test-functional-kernel/releases/download/2026-10-31.4/linux-uml-v7.3-1094-g36aad21d5-cfg6d02b610.zst
    - name: Unpack kernel
      run: |
        zstd -d -q -o "${RUNNER_TEMP}/linux" "${RUNNER_TEMP}/linux.zst"
        chmod +x "${RUNNER_TEMP}/linux"
    - name: Enable KVM
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        stat /dev/kvm
    - name: Install
      run: python3 -m pip install meson-python
    - name: Build
      run: python3 -m pip install --user --no-build-isolation -e .
    - name: Install bumble
      run: python3 -m pip install --user bumble
    - name: Run tests
      run: >-
        python3 -mpytest --kernel="${RUNNER_TEMP}/bzImage" -vv -ra
        -n auto --dist worksteal
        src/pytest_bluezenv/tests
    - name: Run documentation examples
      run: >-
        python3 -mpytest -p pytest_bluezenv --confcutdir=doc/examples
        --kernel="${RUNNER_TEMP}/bzImage" -vv -ra
        doc/examples
    - name: Run VM tests on User Mode Linux
      run: >-
        python3 -mpytest --kernel="${RUNNER_TEMP}/linux" -m "vm and not bumble"
        -vv -ra -n auto --dist worksteal
        --junitxml="${RUNNER_TEMP}/uml-junit.xml"
        src/pytest_bluezenv/tests
    - name: Verify UML VM test passed
      run: >-
        grep -q 'skipped="0"' "${RUNNER_TEMP}/uml-junit.xml" &&
        grep -q 'name="test_vm_no_controller"' "${RUNNER_TEMP}/uml-junit.xml"
