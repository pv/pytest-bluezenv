[build-system]
build-backend = 'mesonpy'
requires = ['meson-python']

[project]
name = "pytest-bluezenv"
description = "pytest BlueZ environment plugin"
readme = "README.rst"
license = "GPL-2.0-or-later"
authors = [{name = "Pauli Virtanen", email = "pav@iki.fi"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.9"
dependencies = [
    "pytest>=8",
    "pexpect",
    "dbus-python",
    "PyGObject>=3.40",
]
license-files = ["LICENSE.txt", "subprojects/bluez/COPYING", "subprojects/bluez/COPYING.LIB"]
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/pv/pytest-bluezenv"
documentation = "https://pv.github.io/pytest-bluezenv/"

[project.optional-dependencies]
docs = ["Sphinx", "pydata-sphinx-theme"]

[tool.meson-python.args]
dist = ['--include-subprojects']
